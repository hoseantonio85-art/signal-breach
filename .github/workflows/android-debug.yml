name: Android debug APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/android-rustore-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify offline Android assets
        run: npm run build:android

  debug-apk:
    # Do not guess or publish a package ID. Set the approved ID in repo vars.
    if: ${{ vars.SIGNAL_ANDROID_APP_ID != '' }}
    needs: offline-web-bundle
    runs-on: ubuntu-latest
    env:
      SIGNAL_ANDROID_APP_ID: ${{ vars.SIGNAL_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build verified offline assets
        run: npm run build:android
      - name: Generate and sync native Android project
        run: npm run android:init
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-breach-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
