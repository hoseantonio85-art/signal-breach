name: Android debug APK

on:
  pull_request:
    branches: [main, release/android-rustore-v1]
  push:
    branches: [release/android-rustore-v1, feature/r2-session-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify offline Android assets
        run: npm run build:android

  debug-apk:
    needs: offline-web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu runners already include Android command-line tools.
      # setup-android@v3 currently requests the removed legacy 'tools' SDK package.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK not installed on GitHub runner}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build verified offline assets
        run: npm run build:android
      - name: Generate and sync native Android project
        run: npm run android:init
      - name: Sync Android versionName and versionCode from package.json
        run: node scripts/sync-android-version.mjs
      - name: Generate branded Android launcher icons
        run: |
          python3 scripts/generate-android-icons.py android
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Require a persistent signing certificate for tester APK
        env:
          SIGNAL_BREACH_DEBUG_KEYSTORE_B64: ${{ secrets.SIGNAL_BREACH_DEBUG_KEYSTORE_B64 }}
        run: |
          node scripts/install-test-signing.mjs
          # This SHA-256 fingerprint MUST match across consecutive tester APKs.
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -n 1
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # Capacitor/Gradle's generated debug signing configuration can ignore the
      # injected ~/.android/debug.keystore. Explicitly sign the FINAL APK with
      # the stable test key before verifying/publishing it.
      - name: Sign final APK with persistent test identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          signed="$RUNNER_TEMP/signal-breach-persistent-signed.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$signed" "$apk"
          test -s "$signed"
          mv "$signed" "$apk"
      - name: Verify APK signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$apk"

          # Verify the ACTUAL final APK signing identity (not only the secret).
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signal-breach-apk-signature.txt"
          actual="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signal-breach-apk-signature.txt" | head -n 1 | tr -d '\r' | tr 'A-F' 'a-f')"
          expected="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | cut -d ' ' -f 1)"
          test -n "$actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK signing fingerprint does not match persistent CI key"
            exit 1
          fi
          echo "APK signing fingerprint verified."

          expected_name="$(node -p "require('./package.json').version")"
          expected_code="$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*1000000+b*1000+c")"
          badge="$("$aapt" dump badging "$apk" | head -n 1)"
          [[ "$badge" == *"name='com.hoseantonio85.signalbreach'"* ]]
          [[ "$badge" == *"versionCode='$expected_code'"* ]]
          [[ "$badge" == *"versionName='$expected_name'"* ]]
          echo "Verified $expected_name (versionCode $expected_code), package com.hoseantonio85.signalbreach."
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-breach-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
