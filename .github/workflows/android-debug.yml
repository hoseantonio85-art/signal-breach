name: Android debug APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/android-rustore-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify offline Android assets
        run: npm run build:android

  debug-apk:
    needs: offline-web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu runners already include Android command-line tools.
      # setup-android@v3 currently requests the removed legacy 'tools' SDK package.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK not installed on GitHub runner}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build verified offline assets
        run: npm run build:android
      - name: Generate and sync native Android project
        run: npm run android:init
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-breach-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
